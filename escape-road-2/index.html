        var config = {

            frameworkUrl: buildUrl + "/escape-road-2-v25010602.framework.js.unityweb",
            codeUrl: buildUrl + "/escape-road-2-v25010602.wasm.unityweb",
            streamingAssetsUrl: versionFolder + "StreamingAssets",
            companyName: "azgames.io",
            productName: "Escape Road 2",
            productVersion: "25010602",
            pubId: ""
        };
        config.gameId = "escape-road-2";
        config.eventLog = true;
        config.buildAPI = "https://event.azgame.io/apiaz/event";
    </script>
    <style type="text/css" id="operaUserStyle"></style>

<body>
    <div id="unity-container" style="display: block;">
        <canvas id="unity-canvas" style="cursor: default;" width="1873" height="923"></canvas>

            <div
                style="position: absolute; font-family: Arial, Helvetica, sans-serif;	bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">
                25010602</div>
            <div class="spinner"></div>
            <div class="jss31 jss34 jss48" style="flex: 1 1 0%;">
                <div class="jss32">
                    <div class="jss7 jss9 jss20 jss3">
                        <div class="jss125">
                            <div class="jss123">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--PRODUCT_VERSION:25010602END-->
            <div class="jss31 jss34" style="flex: 3 1 0%;">
                <div class="jss32">
                    <div class="jss31 jss34 jss39 jss50 gameloader">
                        <div class="jss32">
                            <div class="gameloader-game-name">Escape Road 2</div>
                        </div>
                        <div class="jss32">
                            <div class="jss32 gameloader-logo">
                                <img id="game-logo" src="25010602/loading.png">
                            </div>
                        </div>
                        <div class="jss32">
                            <div>
                                <div class="gameloader-progressbar">
                                    <div class="gameloader-progressbar-progress" id="progress_fill"
                                        style="width: 100%;"></div>
                                </div>
                                <div class="gameloader-progress-info">Downloading file: 100%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var progressElement = document.getElementById('progress_fill');
        var container = document.getElementById("unity-container");
        var canvas = document.getElementById("unity-canvas");
        var loadingBar = document.querySelector("#loadingBlock");
        var progressBarFull = document.querySelector("#progress_fill");
        var progress_text = document.querySelector(".gameloader-progress-info");
        let text_percent = "";
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressElement.style.width = 100 * progress + "%";
                text_percent = "Downloading file: " + Math.round(progress * 100) + "%";
                progress_text.innerText = text_percent;
                if (progress >= 99) {
                    progress_text.innerText = "Game Loading ...";
                }
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                setTimeout(function () {
                    loadingBar.style.display = "none";
                    window.focus();
                }, 2000);
                container.style.display = "block";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
    <script src="25010602/Build/escape-road-2-v25010602.loader.js"></script>
    </script>
